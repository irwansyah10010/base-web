
<div class="card">
    <div class="card-header bg-primary">
        <h4 class="mb-0 text-white">Filter</h4>
    </div>
    <div class="card-body">
        <form class="d-flex flex-wrap" id="filter-form" th:action="${filterAction}" method="POST">
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="tag" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterLogTrxBitRrn" placeholder="RRN" aria-label="RRN" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="credit-card" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterLogTrxCardNo" placeholder="Card Number" aria-label="Card Number" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="list" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterLogTrxTid" placeholder="TID" aria-label="TID" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="cpu" class="feather-sm fill-white"></i></span>
                    <!-- <input type="text" class="form-control" name="filterLogTrxProcode" placeholder="Processing Code" aria-label="Processing Code" autocomplete="off" th:value="${session?.filterLogTrxProcode}"/> -->

                    <input type="text" class="form-control" id="filterLogTrxProcodeAutocomplete" name="filterLogTrxProcodeAutocomplete" placeholder="Processing Code" aria-label="Service"/>
                    <input type="hidden" class="filter-text" id="filterLogTrxProcode" name="filterLogTrxProcode" >
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="code" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterLogTrxRespCode" placeholder="Status" aria-label="Status" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="code" class="feather-sm fill-white"></i></span>
                    <!-- <input type="text" class="form-control" name="filterLogTrxCompanyCode" placeholder="Company Code" aria-label="Company Code" autocomplete="off" th:value="${session?.filterLogTrxCompanyCode}"/> -->

                    <input type="text" class="form-control" id="filterLogTrxCompanyCodeAutocomplete" name="filterLogTrxCompanyCodeAutocomplete" placeholder="UBP Biller / Company Name" aria-label="Company"/>
                    <input type="hidden" class="filter-text" id="filterLogTrxCompanyCode" name="filterLogTrxCompanyCode" aria-label="Company Code" autocomplete="off" /> 
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="message-square" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterLogTrxRespMessage" placeholder="Message" aria-label="Message" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-daterange input-group" id="filterDateRange">
                    <input type="text" class="form-control avoid-clear" name="filterLogTrxYMDStart" placeholder="Start Date" size="15" autocomplete="off" th:value="${session?.filterLogTrxYMDStart}"/>
                    <span class="input-group-text"><i data-feather="calendar" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control avoid-clear" name="filterLogTrxYMDEnd" placeholder="End Date" size="15" autocomplete="off" th:value="${session?.filterLogTrxYMDEnd}"/>
                </div>
            </div>
            <button type="button" class="btn btn-outline-primary mb-2 me-2 btn-clear-filter"><i class="bi-eraser"></i></button>
            <button type="button" id="filter-ajax-btn" class="btn btn-primary mb-2" data-table="#main-datatable">Filter</button>
            <button id="filter-ajax-loader" class="btn btn-outline-primary float-right mb-2" type="button" disabled style="display: none">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                loading...
            </button>
        </form>
    </div>
</div>
