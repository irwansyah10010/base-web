<div class="card">
    <div class="card-header bg-primary">
        <h4 class="mb-0 text-white">Filter</h4>
    </div>
    <div class="card-body">
        <form class="d-flex flex-wrap" id="filter-form" th:action="${filterAction}" method="POST">
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="layers" class="feather-sm fill-white"></i></span>
                    <div th:utext="${comboStepType}" th:remove="tag"></div>
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="info" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterTrxTrackInfo1" placeholder="Info 1" aria-label="Info 1" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-group">
                    <span class="input-group-text"><i data-feather="info" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterTrxTrackInfo2" placeholder="Info 2" aria-label="Info 2" autocomplete="off" />
                </div>
            </div>
            <div class="d-flex flex-wrap mb-2 me-2">
                <div class="input-daterange input-group" id="filterDateRange">
                    <input type="text" class="form-control" name="filterYMDStart" placeholder="Start Date" size="15" autocomplete="off" th:value="${session?.filterYMDStart}" />
                    <span class="input-group-text"><i data-feather="calendar" class="feather-sm fill-white"></i></span>
                    <input type="text" class="form-control" name="filterYMDEnd" placeholder="End Date" size="15" autocomplete="off" th:value="${session?.filterYMDEnd}" />
                </div>
            </div>
            <button type="button" class="btn btn-outline-primary mb-2 me-2 btn-clear-filter"><i class="bi-eraser"></i></button>
            <button type="button" id="filter-ajax-btn" class="btn btn-primary mb-2" data-table="#main-datatable">Filter</button>
            <button id="filter-ajax-loader" class="btn btn-outline-primary float-right mb-2" type="button" disabled style="display: none">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                loading...
            </button>
        </form>
    </div>
</div>
